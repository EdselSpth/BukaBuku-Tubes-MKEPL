# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: ["develop", "main", "feature/**"]
  pull_request:
    branches: ["develop", "main", "feature/**"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 23
        uses: actions/setup-java@v3
        with:
          java-version: "23"
          distribution: "temurin"
          cache: maven

      - name: Build with Maven
        run: mvn -B package --file pom.xml

      - name: Update dependency graph
        uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6

      - name: Analyze with SonarCloud / Continous Inspection
        env:
          GITHUB_TOKEN: ${{ secrets.ACC_GITHUB_TOKEN }} 
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn -B verify sonar:sonar -Dsonar.host.url=https://sonarcloud.io -Dsonar.organization=edselspth -Dsonar.projectKey=EdselSpth_BukaBuku-Tubes-MKEPL

  deploy:
      needs: build
      runs-on: ubuntu-latest
      if: github.base_ref == 'main' && github.event_name == 'pull_request'

      steps:
        - uses: actions/checkout@v4
        - name: Simulasi Deploy ke GitHub Packages
          run: echo "Simulasi deploy ke GitHub Packages berhasil!"